name: neon-sweep-reusable

# Reusable weekly Neon branch sweep. Deletes:
#   - CI orphans: Neon branches named ci/*, ci-pr-*, ci-pt-* older than max_age_hours
#   - preview orphans: preview/<git-branch> older than max_age_hours whose git branch
#     no longer exists in the CALLING repo
# Never touches: primary/default/Neon-protected branches, the hard denylist (main,
# master, staging, production, prod, develop, dev, test-base, preview/develop,
# preview/main), anything in extra_protected, anything younger than max_age_hours, or
# any preview branch whose GitHub lookup errors (only a clean 404 counts as "gone").
# Callers pin by commit SHA:
#   jobs:
#     sweep:
#       uses: infinite-solutions-group/config/.github/workflows/neon-sweep.reusable.yml@<SHA>
#       # config_ref duplicates the uses: SHA because github.job_workflow_sha is empty on workflow_dispatch
#       with: { config_ref: <SHA>, dry_run: false, max_age_hours: 24, extra_protected: '', max_deletes: 25 }
#       secrets: { NEON_API_KEY: ${{ secrets.NEON_API_KEY }}, NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }} }
#       permissions: { contents: read }

on:
  workflow_call:
    inputs:
      config_ref:
        type: string
        default: ''
        description: >-
          Commit SHA of config this reusable is pinned at — pass the same 40-char
          SHA as in `uses:`. Used when github.job_workflow_sha is empty
          (workflow_dispatch).
      dry_run:
        type: boolean
        default: false
      max_age_hours:
        type: number
        default: 24
      extra_protected:
        type: string
        default: ''
      max_deletes:
        type: number
        default: 25
    secrets:
      NEON_API_KEY:
        required: true
      NEON_PROJECT_ID:
        required: true

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Never run two sweeps against the same repo's Neon project at once.
    concurrency:
      group: neon-sweep-${{ github.repository }}
      cancel-in-progress: false
    steps:
      # Resolve the commit to check the sweep script out at, and fail fast if there is
      # none. github.job_workflow_sha normally holds the exact commit this reusable
      # workflow was called at, but it comes back EMPTY on workflow_dispatch runs of the
      # caller and on "Re-run failed jobs". An empty ref makes actions/checkout silently
      # fall back to config's DEFAULT BRANCH — an unpinned (unverified) script that
      # deletes databases. So fall back to the explicit config_ref input (the same SHA as
      # the caller's uses: line), require a full 40-hex SHA, and refuse a mismatch.
      - name: Resolve pinned config ref
        id: ref
        env:
          JOB_SHA: ${{ github.job_workflow_sha }}
          INPUT_REF: ${{ inputs.config_ref }}
        run: |
          set -euo pipefail
          if [ -n "$JOB_SHA" ] && [ -n "$INPUT_REF" ] && [ "$JOB_SHA" != "$INPUT_REF" ]; then
            echo "::error::config_ref ($INPUT_REF) does not match the commit this reusable workflow was called at ($JOB_SHA); the caller is mis-pinned — set config_ref to the same SHA as the uses: line"
            exit 1
          fi
          if [ -n "$JOB_SHA" ]; then
            REF="$JOB_SHA"; SOURCE=job_workflow_sha
          else
            REF="$INPUT_REF"; SOURCE=config_ref
          fi
          if [ -z "$REF" ]; then
            echo "::error::github.job_workflow_sha is empty and no config_ref input was given, so the sweep script cannot be pinned. This happens on workflow_dispatch and on 'Re-run failed jobs' — pass config_ref: <SHA> (the same SHA as the uses: line) or re-run ALL jobs."
            exit 1
          fi
          if ! [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::config_ref must be a full 40-hex commit SHA, got '$REF' — a branch or tag name is never accepted here"
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Pinned config ref: $REF (source: $SOURCE)"

      - name: Checkout sweep script (pinned to this reusable workflow's commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: infinite-solutions-group/config
          ref: ${{ steps.ref.outputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Sweep Neon branches
        # github.repository / github.token inside a reusable workflow are the CALLER's,
        # which is what we want: preview/* is checked against the caller's git branches.
        run: node scripts/neon-sweep.mjs
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
          MAX_AGE_HOURS: ${{ inputs.max_age_hours }}
          EXTRA_PROTECTED: ${{ inputs.extra_protected }}
          MAX_DELETES: ${{ inputs.max_deletes }}
