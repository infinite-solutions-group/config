name: supply-chain
on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
jobs:
  supply-chain:
    uses: infinite-solutions-group/shai-hulud-detect/.github/workflows/scan.reusable.yml@2bb6f93fd4dcdbe88ae5bc8192b838d3e765b1ac
    # scanner_ref duplicates the uses: SHA because github.job_workflow_sha is empty on cross-repository calls
    with:
      scanner_ref: 2bb6f93fd4dcdbe88ae5bc8192b838d3e765b1ac
    permissions:
      contents: read
